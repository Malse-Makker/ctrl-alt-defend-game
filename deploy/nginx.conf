# Two proxies in front of the relay: Nginx Proxy Manager, then this nginx.
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/m;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # NPM sits in front of us; trust its X-Forwarded-For for the rate limit key.
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 51.75.118.72;
    real_ip_header X-Forwarded-For;

    # Security headers on server level: an add_header inside a location would drop all of these.
    # style-src needs 'unsafe-inline' for a few style attributes set from code; no inline scripts.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob: data:; worker-src 'self' blob:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    gzip on;
    # No custom types block here: one in a server block replaces the whole MIME map, and then the
    # JavaScript would be served as octet-stream and refuse to run.
    gzip_types text/css application/javascript application/json image/svg+xml application/octet-stream audio/x-wav audio/wav;
    gzip_min_length 1024;

    client_max_body_size 64k;

    location /api/ {
        limit_req zone=api burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://relay:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
    }

    # Hashed build files never change: cache for a long time.
    location /assets/ {
        expires 365d;
    }

    location ~* \.(glb|png|wav|svg|woff2?)$ {
        expires 7d;
    }

    location = /version.json {
        expires -1;
    }

    location = /index.html {
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
