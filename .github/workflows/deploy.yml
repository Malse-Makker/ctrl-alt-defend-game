name: Test and deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Never two deploys at once: they would clash on the container names.
concurrency:
  group: uitrol
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run build
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Relay tests
        working-directory: server/relay
        run: |
          pip install -r requirements-dev.txt
          python -m pytest -q test_app.py

  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.SSH_PRIVATE_KEY != '' }}
    steps:
      - name: Deploy via SSH
        if: env.HAS_KEY == 'true'
        run: |
          KEY_FILE="$(mktemp)"
          trap 'rm -f "$KEY_FILE"' EXIT
          chmod 600 "$KEY_FILE"
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > "$KEY_FILE"
          ssh -i "$KEY_FILE" -o StrictHostKeyChecking=no ubuntu@makkers.net \
            'cd /home/ubuntu/ctrl-alt-defend-game && git pull --ff-only origin main && GIT_COMMIT=$(git rev-parse --short HEAD) docker compose up -d --build --force-recreate'
      - name: No deploy key yet
        if: env.HAS_KEY != 'true'
        run: echo "SSH_PRIVATE_KEY is not set for this repo; tests passed, deploy skipped. See README."

  controleren:
    needs: [test, deploy]
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      WEBHOOK: ${{ secrets.MATTERMOST_WEBHOOK }}
      UITROL: ${{ join(needs.*.result, ',') }}
      URLS: "https://game.makkers.net/"
      REPO: ${{ github.repository }}
      RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Antwoordt de site, en melden in #git-updates
        run: |
          stuk=""
          for url in $URLS; do
            code=000
            # Drie minuten de tijd: een container die net is herbouwd heeft
            # soms even nodig. Een doorverwijzing (naar een inlogpagina) telt
            # als levend; pas vanaf 500 of zonder antwoord is het stuk.
            for i in $(seq 1 18); do
              # '|| true': GitHub draait dit met set -e, en dan stopt een
              # mislukte curl het script vóór de melding -- juist dan.
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$url" || true)
              code=${code:-000}
              [ "$code" -ge 200 ] && [ "$code" -lt 500 ] && break
              sleep 10
            done
            if [ "$code" -lt 200 ] || [ "$code" -ge 500 ]; then stuk="$stuk $url (HTTP $code)"; fi
          done
          commit=$(gh api "repos/$REPO/commits/main" --jq '"\(.sha[0:7]) \(.commit.message | split("\n")[0])"' || echo "onbekende commit")
          if echo "$UITROL" | grep -qvE '^((success|skipped),?)+$' || [ -n "$stuk" ]; then
            reden="uitrol: $UITROL"; [ -n "$stuk" ] && reden="$reden; antwoordt niet:$stuk"
            tekst=":red_circle: **$REPO** kapot na de uitrol van \`$commit\`
          $reden — [wat er misging]($RUN)"
            fout=1
          else
            tekst=":white_check_mark: **$REPO** live: \`$commit\`"
            fout=0
          fi
          if [ -n "$WEBHOOK" ]; then
            curl -sS -X POST -H 'Content-Type: application/json' \
                 -d "$(jq -n --arg t "$tekst" '{text: $t}')" "$WEBHOOK" >/dev/null
          fi
          echo "$tekst"
          exit $fout
