name: Pull request checks

# Runs for every pull request (also from forks). No secrets are used here.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Relay tests
        working-directory: server/relay
        run: |
          pip install -r requirements-dev.txt
          python -m pytest -q test_app.py

  ui:
    # Plays through the screens in headless Chrome and fails on text that overlaps, sticks out
    # or falls off the screen. The screenshots are attached to the run.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Start the game
        run: |
          npm run dev > vite.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:5173/ > /dev/null && exit 0
            sleep 1
          done
          cat vite.log
          exit 1
      - name: UI check
        run: npx tsx tools/uicheck.ts --out shots
      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: shots/
          retention-days: 14
